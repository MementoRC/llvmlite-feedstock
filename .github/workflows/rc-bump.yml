name: RC version bump check

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and print the bump, but do not push or open a PR'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKAGE: llvmlite
  REPO: MementoRC/llvmlite-feedstock
  UPSTREAM: conda-forge/llvmlite-feedstock
  RC_BRANCH: rc

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (for the bump script)
        uses: actions/checkout@v4
        with:
          path: scaffold

      - name: Checkout the fork (working tree for the bump)
        uses: actions/checkout@v4
        with:
          path: rc
          fetch-depth: 0
          persist-credentials: false

      # The fork's own rc ref lags upstream's whenever a PR is merged on
      # conda-forge, so the recipe we bump is taken from upstream/rc and the
      # PR is opened cross-fork against conda-forge:rc.
      - name: Pin the working tree to upstream/rc
        working-directory: rc
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "$RC_BRANCH" --no-tags
          git checkout -B "$RC_BRANCH" "upstream/${RC_BRANCH}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging
        run: python3 -m pip install --upgrade packaging

      - name: Check PyPI for a newer prerelease
        id: bump
        run: |
          python3 "${GITHUB_WORKSPACE}/scaffold/.github/scripts/bump_rc.py" \
            rc/recipe/recipe.yaml --package "$PACKAGE"

      - name: Skip if a bump PR for this version is already open
        id: existing
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CF_FEEDSTOCK_PAT }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          BRANCH="rc-bump/${NEW_VERSION}"
          # Fail SAFE, and note this is the OPPOSITE bias to rc-sync.yml's
          # equivalent guard. There a spurious "no PR open" was harmless. Here
          # it would force-push over a branch a human is editing, so anything
          # unparseable or errored must be treated as "a PR exists" and skip.
          #
          # Matching on headRefName rather than `gh pr list --head`: --head is
          # ambiguous for a cross-fork PR (the API wants owner:ref) and a silent
          # non-match here destroys work.
          RAW="$(gh pr list --repo "$UPSTREAM" --base "$RC_BRANCH" \
                   --state open --json headRefName,number 2>&1)" || RAW="ERROR"
          echo "gh pr list raw: [${RAW}]"
          COUNT="$(printf '%s' "$RAW" \
            | jq --arg b "$BRANCH" '[.[] | select(.headRefName == $b)] | length' 2>/dev/null)" || COUNT=""
          case "$COUNT" in
            '' | *[!0-9]*)
              echo "::warning::could not determine an open-PR count; assuming one exists and skipping"
              COUNT=1
              ;;
          esac
          if [ "$COUNT" != "0" ]; then
            echo "A PR for ${BRANCH} is already open - leaving it alone"
          fi
          echo "open=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Dry run - show what would be committed
        if: steps.bump.outputs.changed == 'true' && inputs.dry_run
        working-directory: rc
        run: git diff

      - name: Open PR into conda-forge rc
        if: steps.bump.outputs.changed == 'true' && steps.existing.outputs.open == '0' && !inputs.dry_run
        working-directory: rc
        env:
          GH_TOKEN: ${{ secrets.CF_FEEDSTOCK_PAT }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          SHA256: ${{ steps.bump.outputs.sha256 }}
          TARBALL_URL: ${{ steps.bump.outputs.tarball_url }}
        run: |
          OWNER="${REPO%%/*}"
          BRANCH="rc-bump/${NEW_VERSION}"

          git config user.name "rc-bump-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "${PACKAGE} rc: bump ${OLD_VERSION} -> ${NEW_VERSION}"

          git remote set-url --push upstream "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force upstream "HEAD:refs/heads/${BRANCH}"

          # The checklist header is a committed file rather than a heredoc:
          # it keeps backticks and markdown out of shell quoting entirely.
          cat "${GITHUB_WORKSPACE}/scaffold/.github/rc-pr-body-header.md" > "${RUNNER_TEMP}/pr-body.md"
          {
            printf '\n'
            printf 'Automated %s release-candidate bump.\n\n' "$PACKAGE"
            printf -- '- version: %s -> %s\n' "$OLD_VERSION" "$NEW_VERSION"
            printf -- '- build number reset to 0 (version changed)\n'
            printf -- '- sdist: %s\n' "$TARBALL_URL"
            printf -- '- sha256: %s\n' "$SHA256"
            printf '\n'
            printf 'Auto-generated by .github/workflows/rc-bump.yml on the %s default branch.\n' "$REPO"
            printf 'The head branch lives only on %s; nothing is created on %s.\n' "$REPO" "$UPSTREAM"
          } >> "${RUNNER_TEMP}/pr-body.md"

          gh pr create \
            --repo "$UPSTREAM" \
            --base "$RC_BRANCH" \
            --head "${OWNER}:${BRANCH}" \
            --title "[rc] ${PACKAGE}: ${OLD_VERSION} -> ${NEW_VERSION}" \
            --body-file "${RUNNER_TEMP}/pr-body.md" \
            || echo "PR create skipped (may already exist)"
